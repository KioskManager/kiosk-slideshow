<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>키오스크 슬라이드쇼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: sans-serif;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }
    .slide.active { opacity: 1; }

    #progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      background: rgba(255,255,255,0.6);
      width: 0%;
      transition: width linear;
      z-index: 10;
    }

    #no-images {
      display: none;
      position: fixed;
      inset: 0;
      color: #fff;
      font-size: 1.4rem;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 2;
    }

    #admin-btn {
      position: fixed;
      bottom: 18px; right: 18px;
      width: 38px; height: 38px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 100;
      opacity: 0;
    }
    #admin-btn:hover { opacity: 0.3; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #1e1e2e;
      border-radius: 16px;
      padding: 36px 32px;
      width: 360px;
      color: #cdd6f4;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #cba6f7;
      letter-spacing: 0.04em;
    }

    .modal input[type="password"],
    .modal input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #313244;
      color: #cdd6f4;
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
    }
    .modal input:focus { border-color: #cba6f7; }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #cba6f7; color: #1e1e2e; font-weight: 700; }
    .btn-danger  { background: #f38ba8; color: #1e1e2e; font-weight: 700; }
    .btn-ghost   { background: transparent; color: #6c7086; border: 1px solid #45475a; }

    .error-msg { color: #f38ba8; font-size: 0.85rem; margin-bottom: 10px; min-height: 18px; }

    #admin-panel .modal { width: 480px; max-height: 80vh; overflow-y: auto; }

    .image-list { margin: 16px 0; }
    .image-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #313244;
    }
    .image-item img {
      width: 60px; height: 60px;
      object-fit: cover;
      border-radius: 6px;
      background: #313244;
    }
    .image-item .img-name {
      flex: 1;
      font-size: 0.9rem;
      color: #a6adc8;
      word-break: break-all;
    }

    .upload-area {
      border: 2px dashed #45475a;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin: 16px 0;
      color: #6c7086;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: #cba6f7; color: #cba6f7; }
    .upload-area input { display: none; }

    .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }

    .notice {
      background: #313244;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #a6adc8;
      line-height: 1.6;
      margin-top: 14px;
    }
    .notice strong { color: #cba6f7; }
  </style>
</head>
<body>

  <div id="progress-bar"></div>
  <div id="no-images">등록된 이미지가 없습니다.<br>우하단 버튼을 눌러 관리자 페이지에 접속하세요.</div>
  <button id="admin-btn" title="관리자">⚙</button>

  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h2>🔐 관리자 로그인</h2>
      <input type="password" id="pw-input" placeholder="비밀번호 입력" />
      <div class="error-msg" id="pw-error"></div>
      <div class="row">
        <button class="btn btn-ghost" onclick="closeLogin()">취소</button>
        <button class="btn btn-primary" onclick="doLogin()">확인</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="admin-panel">
    <div class="modal">
      <h2>🖼 슬라이드쇼 관리</h2>

      <div class="upload-area" onclick="document.getElementById('file-input').click()">
        📁 클릭하여 이미지 추가<br>
        <input type="file" id="file-input" accept="image/*" multiple onchange="handleUpload(event)"/>
      </div>

      <div class="image-list" id="image-list"></div>

      <div class="notice">
        <strong>📌 안내</strong><br>
        • 이미지는 이 기기(브라우저)에 저장됩니다.<br>
        • 키오스크 전용 브라우저에서 등록하면 키오스크에 표시됩니다.<br>
        • 브라우저를 초기화하면 이미지가 삭제됩니다.
      </div>

      <div class="row" style="margin-top:20px">
        <button class="btn btn-ghost" onclick="closeAdmin()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // =============================================
    // ★ 관리자 비밀번호 — 여기만 바꾸세요 ★
    const ADMIN_PASSWORD = "044550";
    // =============================================

    const INTERVAL = 7000;
    let images = [];
    let current = 0;
    let timer = null;
    let slideEls = [];

    function loadImages() {
      try {
        const saved = localStorage.getItem("kiosk_images");
        images = saved ? JSON.parse(saved) : [];
      } catch(e) { images = []; }
    }

    function saveImages() {
      localStorage.setItem("kiosk_images", JSON.stringify(images));
    }

    function renderSlideshow() {
      slideEls.forEach(el => el.remove());
      slideEls = [];
      clearInterval(timer);

      const noImg = document.getElementById("no-images");

      if (images.length === 0) {
        noImg.style.display = "flex";
        document.getElementById("progress-bar").style.width = "0";
        return;
      }
      noImg.style.display = "none";

      images.forEach(img => {
        const el = document.createElement("img");
        el.className = "slide";
        el.src = img.dataUrl;
        el.alt = img.name;
        el.draggable = false;
        document.body.insertBefore(el, document.getElementById("progress-bar"));
        slideEls.push(el);
      });

      current = 0;
      showSlide(0);
      if (images.length > 1) {
        timer = setInterval(() => {
          current = (current + 1) % images.length;
          showSlide(current);
        }, INTERVAL);
      }
    }

    const progressBar = document.getElementById("progress-bar");

    function showSlide(index) {
      slideEls.forEach(el => el.classList.remove("active"));
      if (slideEls[index]) slideEls[index].classList.add("active");

      progressBar.style.transition = "none";
      progressBar.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        progressBar.style.transition = `width ${INTERVAL}ms linear`;
        progressBar.style.width = "100%";
      }));
    }

    document.getElementById("admin-btn").addEventListener("click", () => {
      document.getElementById("login-modal").classList.add("open");
      document.getElementById("pw-input").value = "";
      document.getElementById("pw-error").textContent = "";
      setTimeout(() => document.getElementById("pw-input").focus(), 100);
    });

    document.getElementById("pw-input").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    function doLogin() {
      const val = document.getElementById("pw-input").value;
      if (val === ADMIN_PASSWORD) {
        closeLogin();
        openAdmin();
      } else {
        document.getElementById("pw-error").textContent = "비밀번호가 틀렸습니다.";
        document.getElementById("pw-input").value = "";
      }
    }

    function closeLogin() {
      document.getElementById("login-modal").classList.remove("open");
    }

    function openAdmin() {
      renderImageList();
      document.getElementById("admin-panel").classList.add("open");
    }

    function closeAdmin() {
      document.getElementById("admin-panel").classList.remove("open");
      renderSlideshow();
    }

    function renderImageList() {
      const list = document.getElementById("image-list");
      list.innerHTML = "";
      if (images.length === 0) {
        list.innerHTML = '<p style="color:#6c7086;font-size:0.9rem;padding:10px 0">등록된 이미지가 없습니다.</p>';
        return;
      }
      images.forEach((img, i) => {
        const item = document.createElement("div");
        item.className = "image-item";
        item.innerHTML = `
          <img src="${img.dataUrl}" alt="${img.name}"/>
          <span class="img-name">${img.name}</span>
          <button class="btn btn-danger" onclick="deleteImage(${i})">삭제</button>
        `;
        list.appendChild(item);
      });
    }

    function deleteImage(index) {
      if (!confirm(images[index].name + " 을(를) 삭제할까요?")) return;
      images.splice(index, 1);
      saveImages();
      renderImageList();
    }

    function handleUpload(event) {
      const files = Array.from(event.target.files);
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          images.push({ name: file.name, dataUrl: e.target.result });
          loaded++;
          if (loaded === files.length) {
            saveImages();
            renderImageList();
          }
        };
        reader.readAsDataURL(file);
      });
      event.target.value = "";
    }

    document.addEventListener("keydown", e => {
      if (document.getElementById("login-modal").classList.contains("open") ||
          document.getElementById("admin-panel").classList.contains("open")) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown") {
        clearInterval(timer);
        current = (current + 1) % images.length;
        showSlide(current);
        if (images.length > 1) timer = setInterval(() => {
          current = (current + 1) % images.length;
          showSlide(current);
        }, INTERVAL);
      }
    });

    loadImages();
    renderSlideshow();
  </script>
</body>
</html>

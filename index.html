<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>키오스크 슬라이드쇼</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }
    .slide.active { opacity: 1; }

    #progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      background: rgba(255,255,255,0.6);
      width: 0%;
      transition: width linear;
      z-index: 10;
    }

    #no-images {
      display: none;
      position: fixed;
      inset: 0;
      color: #fff;
      font-size: 1.4rem;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 2;
    }

    #admin-btn {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 44px; height: 44px;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: background 0.2s;
    }
    #admin-btn:hover { background: rgba(255,255,255,0.3); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #1e1e2e;
      border-radius: 16px;
      padding: 36px 32px;
      width: 360px;
      color: #cdd6f4;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #cba6f7;
    }

    .modal input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #313244;
      color: #cdd6f4;
      font-size: 1rem;
      margin-bottom: 14px;
      outline: none;
    }
    .modal input:focus { border-color: #cba6f7; }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #cba6f7; color: #1e1e2e; font-weight: 700; }
    .btn-danger  { background: #f38ba8; color: #1e1e2e; font-weight: 700; }
    .btn-ghost   { background: transparent; color: #6c7086; border: 1px solid #45475a; }

    .error-msg { color: #f38ba8; font-size: 0.85rem; margin-bottom: 10px; min-height: 18px; }

    #admin-panel .modal { width: 500px; max-height: 85vh; overflow-y: auto; }

    .image-list { margin: 16px 0; }
    .image-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #313244;
    }
    .image-item img {
      width: 60px; height: 60px;
      object-fit: cover;
      border-radius: 6px;
      background: #313244;
    }
    .image-item .img-name {
      flex: 1;
      font-size: 0.9rem;
      color: #a6adc8;
      word-break: break-all;
    }

    .upload-area {
      border: 2px dashed #45475a;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      margin: 16px 0;
      color: #6c7086;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover { border-color: #cba6f7; color: #cba6f7; }
    .upload-area input { display: none; }

    .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }

    .notice {
      background: #313244;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #a6adc8;
      line-height: 1.6;
      margin-top: 14px;
    }
    .notice strong { color: #cba6f7; }

    .uploading-msg {
      color: #a6e3a1;
      font-size: 0.85rem;
      margin: 8px 0;
      min-height: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="progress-bar"></div>
  <div id="no-images">등록된 이미지가 없습니다.<br>우하단 버튼을 눌러 관리자 페이지에 접속하세요.</div>
  <button id="admin-btn" title="관리자">⚙️</button>

  <!-- 로그인 모달 -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal">
      <h2>🔐 관리자 로그인</h2>
      <input type="password" id="pw-input" placeholder="비밀번호 입력" />
      <div class="error-msg" id="pw-error"></div>
      <div class="row">
        <button class="btn btn-ghost" onclick="closeLogin()">취소</button>
        <button class="btn btn-primary" onclick="doLogin()">확인</button>
      </div>
    </div>
  </div>

  <!-- 관리자 패널 -->
  <div class="modal-overlay" id="admin-panel">
    <div class="modal">
      <h2>🖼 슬라이드쇼 관리</h2>

      <div class="upload-area" onclick="document.getElementById('file-input').click()">
        📁 클릭하여 이미지 추가 (여러 장 동시 가능)<br>
        <input type="file" id="file-input" accept="image/*" multiple onchange="handleUpload(event)"/>
      </div>
      <div class="uploading-msg" id="uploading-msg"></div>

      <div class="image-list" id="image-list"></div>

      <div class="notice">
        <strong>📌 안내</strong><br>
        • 이미지는 Cloudinary 서버에 저장됩니다.<br>
        • 어떤 기기, 어떤 브라우저에서 열어도 동일하게 표시됩니다.<br>
        • 삭제한 이미지는 복구되지 않습니다.
      </div>

      <div class="row" style="margin-top:20px">
        <button class="btn btn-ghost" onclick="closeAdmin()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // =============================================
    // ★ 아래 3가지를 본인 값으로 바꾸세요 ★
    const CLOUD_NAME   = "dnme4st3h";   // Cloudinary Cloud name
    const UPLOAD_PRESET = "kiosk_upload";      // 방금 만든 Upload Preset 이름
    const ADMIN_PASSWORD = "044550";    // 관리자 비밀번호
    // =============================================

    const INTERVAL = 8000;
    const FOLDER   = "kiosk";  // Cloudinary에 저장될 폴더명

    let images = [];   // [{ publicId, url }]
    let current = 0;
    let timer = null;
    let slideEls = [];

    /* ── Cloudinary에서 이미지 목록 불러오기 ── */
    async function fetchImages() {
      try {
        // Cloudinary 검색 API (unsigned search)
        const res = await fetch(
          `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${FOLDER}.json`,
          { cache: "no-store" }
        );
        if (!res.ok) { images = []; return; }
        const data = await res.json();
        images = (data.resources || []).map(r => ({
          publicId: r.public_id,
          url: `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${r.public_id}`
        }));
      } catch(e) { images = []; }
    }

    /* ── 슬라이드쇼 렌더 ── */
    function renderSlideshow() {
      slideEls.forEach(el => el.remove());
      slideEls = [];
      clearInterval(timer);

      const noImg = document.getElementById("no-images");
      if (images.length === 0) {
        noImg.style.display = "flex";
        document.getElementById("progress-bar").style.width = "0";
        return;
      }
      noImg.style.display = "none";

      images.forEach(img => {
        const el = document.createElement("img");
        el.className = "slide";
        el.src = img.url;
        el.alt = img.publicId;
        el.draggable = false;
        document.body.insertBefore(el, document.getElementById("progress-bar"));
        slideEls.push(el);
      });

      current = 0;
      showSlide(0);
      if (images.length > 1) {
        timer = setInterval(() => {
          current = (current + 1) % images.length;
          showSlide(current);
        }, INTERVAL);
      }
    }

    const progressBar = document.getElementById("progress-bar");

    function showSlide(index) {
      slideEls.forEach(el => el.classList.remove("active"));
      if (slideEls[index]) slideEls[index].classList.add("active");
      progressBar.style.transition = "none";
      progressBar.style.width = "0%";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        progressBar.style.transition = `width ${INTERVAL}ms linear`;
        progressBar.style.width = "100%";
      }));
    }

    /* ── 로그인 ── */
    document.getElementById("admin-btn").addEventListener("click", () => {
      document.getElementById("login-modal").classList.add("open");
      document.getElementById("pw-input").value = "";
      document.getElementById("pw-error").textContent = "";
      setTimeout(() => document.getElementById("pw-input").focus(), 100);
    });

    document.getElementById("pw-input").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    function doLogin() {
      const val = document.getElementById("pw-input").value;
      if (val === ADMIN_PASSWORD) {
        closeLogin();
        openAdmin();
      } else {
        document.getElementById("pw-error").textContent = "비밀번호가 틀렸습니다.";
        document.getElementById("pw-input").value = "";
      }
    }

    function closeLogin() {
      document.getElementById("login-modal").classList.remove("open");
    }

    /* ── 관리자 패널 ── */
    async function openAdmin() {
      document.getElementById("admin-panel").classList.add("open");
      document.getElementById("image-list").innerHTML = '<p style="color:#6c7086;font-size:0.9rem;padding:10px 0">불러오는 중...</p>';
      await fetchImages();
      renderImageList();
    }

    function closeAdmin() {
      document.getElementById("admin-panel").classList.remove("open");
      fetchImages().then(renderSlideshow);
    }

    function renderImageList() {
      const list = document.getElementById("image-list");
      list.innerHTML = "";
      if (images.length === 0) {
        list.innerHTML = '<p style="color:#6c7086;font-size:0.9rem;padding:10px 0">등록된 이미지가 없습니다.</p>';
        return;
      }
      images.forEach((img, i) => {
        const item = document.createElement("div");
        item.className = "image-item";
        item.innerHTML = `
          <img src="${img.url}" alt="${img.publicId}"/>
          <span class="img-name">${img.publicId.replace(FOLDER + "/", "")}</span>
          <button class="btn btn-danger" onclick="deleteImage(${i})">삭제</button>
        `;
        list.appendChild(item);
      });
    }

    /* ── 이미지 삭제 ── */
    async function deleteImage(index) {
      if (!confirm(images[index].publicId.replace(FOLDER + "/", "") + " 을(를) 삭제할까요?")) return;
      // Cloudinary unsigned delete (destroy)
      const publicId = images[index].publicId;
      const formData = new FormData();
      formData.append("public_id", publicId);
      formData.append("upload_preset", UPLOAD_PRESET);
      // 삭제는 서버사이드가 필요하므로, 목록에서만 제거 후 안내
      images.splice(index, 1);
      renderImageList();
      alert("목록에서 제거했습니다.\nCloudinary 대시보드에서도 직접 삭제해주세요.");
    }

    /* ── 이미지 업로드 ── */
    async function handleUpload(event) {
      const files = Array.from(event.target.files);
      const msg = document.getElementById("uploading-msg");
      msg.textContent = `업로드 중... (0/${files.length})`;

      let done = 0;
      for (const file of files) {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);
        formData.append("folder", FOLDER);

        try {
          const res = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
            { method: "POST", body: formData }
          );
          const data = await res.json();
          if (data.public_id) {
            images.push({ publicId: data.public_id, url: data.secure_url });
          }
        } catch(e) {
          alert(file.name + " 업로드 실패");
        }
        done++;
        msg.textContent = `업로드 중... (${done}/${files.length})`;
      }

      msg.textContent = "✅ 업로드 완료!";
      setTimeout(() => { msg.textContent = ""; }, 2000);
      renderImageList();
      event.target.value = "";
    }

    /* ── 초기 실행 ── */
    fetchImages().then(renderSlideshow);

    // 5분마다 자동 새로고침 (이미지 추가 시 자동 반영)
    setInterval(() => {
      fetchImages().then(renderSlideshow);
    }, 5 * 60 * 1000);
  </script>
</body>
</html>
